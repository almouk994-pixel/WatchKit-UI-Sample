version: 2.1
jobs:
  build:
    macos:
      xcode: "14.3.1" # هذا هو السطر الذهبي الذي يجبر السيرفر على استخدام النسخة الداعمة لساعتك
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
          
      - run:
          name: Create project.yml
          command: |
            cat \<< 'EOF' > project.yml
            name: TVRemote
            options:
              bundleIdPrefix: com.tvremote
              xcodeVersion: "14.3"
            targets:
              TVRemoteApp:
                type: application
                platform: iOS
                deploymentTarget: "15.0"
                sources: [iOSApp]
                dependencies:
                  - target: TVRemoteWatch
                    embed: true
                settings:
                  CODE_SIGNING_ALLOWED: "NO"
                  GENERATE_INFOPLIST_FILE: "YES"
              TVRemoteWatch:
                type: application
                platform: watchOS
                deploymentTarget: "8.0" 
                sources: [WatchApp]
                settings:
                  CODE_SIGNING_ALLOWED: "NO"
                  GENERATE_INFOPLIST_FILE: "YES"
            EOF
            
      - run:
          name: Setup Source Files
          command: |
            mkdir -p iOSApp WatchApp
            
            cat \<< 'EOF' > iOSApp/App.swift
            import SwiftUI
            @main struct TVRemoteApp: App {
                var body: some Scene { WindowGroup { Text("تطبيق الساعة جاهز. سيظهر الآن في تطبيق Watch لتثبيته.") } }
            }
            EOF
            
            cat \<< 'EOF' > WatchApp/App.swift
            import SwiftUI
            @main struct TVRemoteWatchApp: App {
                var body: some Scene { WindowGroup { ContentView() } }
            }
            EOF
            
            USER_FILE=$(find . -name "ContentView.swift" -not -path "./WatchApp/*" | head -n 1)
            cp "$USER_FILE" WatchApp/ContentView.swift
            
      - run:
          name: Generate Xcode Project
          command: xcodegen generate
          
      - run:
          name: Build Project
          command: |
            xcodebuild clean build \
              -project TVRemote.xcodeproj \
              -scheme TVRemoteApp \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              SYMROOT=$(pwd)/build_output
              
      - run:
          name: Package IPA
          command: |
            mkdir -p Payload
            cp -R build_output/Release-iphoneos/TVRemoteApp.app Payload/
            zip -r TVRemote_TrollStore.ipa Payload
            
      - store_artifacts:
          path: TVRemote_TrollStore.ipa
