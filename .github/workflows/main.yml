name: Build iOS and Watch App for TrollStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat << 'EOF' > project.yml
          name: TVRemote
          options:
            bundleIdPrefix: com.tvremote
            xcodeVersion: "15.0" # هذا السطر السحري لحل مشكلة التوافق
          targets:
            TVRemoteApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [iOSApp]
              dependencies:
                - target: TVRemoteWatch
                  embed: true
              settings:
                CODE_SIGNING_ALLOWED: "NO"
                GENERATE_INFOPLIST_FILE: "YES"
            TVRemoteWatch:
              type: application
              platform: watchOS
              deploymentTarget: "8.0" 
              sources: [WatchApp]
              settings:
                CODE_SIGNING_ALLOWED: "NO"
                GENERATE_INFOPLIST_FILE: "YES"
          EOF

      - name: Setup Source Files
        run: |
          mkdir -p iOSApp WatchApp
          
          cat << 'EOF' > iOSApp/App.swift
          import SwiftUI
          @main struct TVRemoteApp: App {
              var body: some Scene { WindowGroup { Text("تطبيق الساعة جاهز. سيظهر الآن في تطبيق Watch لتثبيته.") } }
          }
          EOF
          
          cat << 'EOF' > WatchApp/App.swift
          import SwiftUI
          @main struct TVRemoteWatchApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          
          USER_FILE=$(find . -name "ContentView.swift" -not -path "./WatchApp/*" | head -n 1)
          cp "$USER_FILE" WatchApp/ContentView.swift

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Project
        run: |
          xcodebuild clean build \
            -project TVRemote.xcodeproj \
            -scheme TVRemoteApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/TVRemoteApp.app Payload/
          zip -r TVRemote_TrollStore.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-App
          path: TVRemote_TrollStore.ipa
