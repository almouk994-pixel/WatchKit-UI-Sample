name: Build IPA for TrollStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find and Build Project
        run: |
          PROJECT_FILE=$(ls | grep .xcodeproj | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | grep -A 1 'Schemes:' | tail -n 1 | xargs)
          echo "Building Scheme: $SCHEME_NAME for watchOS"
          
          # توجيه البناء لنظام الساعة (watchOS)
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk watchos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENTITLEMENTS_REQUIRED=NO
            
      - name: Package into .ipa
        run: |
          mkdir -p Payload
          # سحب التطبيق الخاص بالساعة وتحزيمه
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-watchos/*" -exec cp -R {} Payload/ \;
          zip -r TVRemote_TrollStore.ipa Payload
          
      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-App
          path: TVRemote_TrollStore.ipa
